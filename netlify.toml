# Simetrics — configuração de deploy Netlify.
# O app Vite vive em web/; o Streamlit legado permanece na raiz e não é publicado.

[build]
  base      = "web/"
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas as rotas caem no index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"

# Assets com hash no nome podem ser cacheados indefinidamente.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"

[dev]
  command    = "npm run dev"
  targetPort = 5173
  port       = 8888
